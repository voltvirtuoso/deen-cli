[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deen-cli"
version = "0.1.0"
description = "Git-style Islamic productivity companion for developers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0"
]

[project.scripts]
deen = "deen.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["deen*"]